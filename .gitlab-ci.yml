# Définition des stages
stages:
  - test
  - build
  - deploy

# Variables globales
variables:
  DOCKER_REGISTRY: ${CI_REGISTRY}
  DOCKER_IMAGE_FRONTEND: ${DOCKER_REGISTRY}/${CI_PROJECT_PATH}/frontend
  DOCKER_IMAGE_BACKEND: ${DOCKER_REGISTRY}/${CI_PROJECT_PATH}/backend

# Cache pour les dépendances
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/
    - backend/node_modules/

# Job de test frontend
test_frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm install
    - npm run test
  only:
    - main
    - merge_requests

# Job de test backend
test_backend:
  stage: test
  image: node:18-alpine
  script:
    - cd backend
    - npm install
    - npm run test
  only:
    - main
    - merge_requests

# Job de build frontend
build_frontend:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE_FRONTEND:$CI_COMMIT_SHA -t $DOCKER_IMAGE_FRONTEND:latest -f frontend/Dockerfile frontend/
    - docker push $DOCKER_IMAGE_FRONTEND:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE_FRONTEND:latest
  only:
    - main

# Job de build backend
build_backend:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE_BACKEND:$CI_COMMIT_SHA -t $DOCKER_IMAGE_BACKEND:latest -f backend/Dockerfile backend/
    - docker push $DOCKER_IMAGE_BACKEND:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE_BACKEND:latest
  only:
    - main

# Job de déploiement
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$SSH_HOST "cd /path/to/project && docker compose pull && docker compose up -d"
  environment:
    name: production
  only:
    - main 