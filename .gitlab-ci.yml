image: node:18-alpine

stages:
  - build
  - lint
  - test
  - e2e
  - dockerize
  - deploy

variables:
  DOCKER_COMPOSE_VERSION: "2.20.0"

before_script:
  - apk add --no-cache docker-cli docker-compose
  - docker-compose --version

build:
  stage: build
  script:
    - cd frontend
    - npm install
    - npm run build

lint:
  stage: lint
  script:
    - cd backend && npm install && npm run lint
    - cd ../frontend && npm install && npm run lint

test:
  stage: test
  script:
    - cd backend
    - npm install
    - npm test

e2e:
  stage: e2e
  script:
    - cd frontend
    - npm install
    - npm run cypress:run

dockerize:
  stage: dockerize
  script:
    - docker-compose build

deploy:
  stage: deploy
  script:
    - docker-compose up -d
  when: manual 